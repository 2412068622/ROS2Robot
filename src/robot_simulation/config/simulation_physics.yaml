schema_version: 1
profile: reference_sim_v1

physics:
  max_step_size_s: 0.001
  real_time_factor: 1.0

contact:
  use_simulator_defaults: true

sensors:
  lidar:
    update_rate_hz: 10.0
    samples: 360
    angular_resolution: 1.0
    min_angle_rad: -3.14159265359
    max_angle_rad: 3.14159265359
    min_range_m: 0.08
    max_range_m: 12.0
    range_resolution_m: 0.01
    noise_stddev_m: 0.0
  imu:
    update_rate_hz: 100.0
    use_simulator_default_noise: true
  camera:
    enabled: false
    update_rate_hz: 15.0
    horizontal_fov_rad: 1.2
    image_width_px: 640
    image_height_px: 480
